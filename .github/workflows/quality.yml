name: Release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODEL_DRIVER: fake
      PROCESSING_ENABLED: 'true'
      JOB_DRIVER: in-process
      BLOB_DRIVER: filesystem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=moderate
      - name: Check patched schema loader
        run: node node_modules/drizzle-kit/bin.cjs generate --dialect postgresql --schema ./lib/db/schema.ts --out ./.data/ci-schema
      - run: npm run check:secrets
      - name: Locate disposable PostgreSQL binaries
        run: printf 'PG_TEST_BIN=%s\n' "$(pg_config --bindir)" >> "$GITHUB_ENV"
      - run: npm run test:race:native
      - run: npx playwright install --with-deps chromium msedge
      - run: npm run test:product
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/evidence/hardening-2026-11-05
            docs/evidence/phase-6
            docs/evidence/playwright-results.json
            docs/evidence/t23-*.json
          retention-days: 7
